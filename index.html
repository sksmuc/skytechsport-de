---
layout: default
---

<style>
.skytech-hero {
    position: relative;
    isolation: isolate;
    display: flex;
    align-items: center;
    gap: 4rem;
    min-height: 580px;
    padding: 5rem 6%;
    box-sizing: border-box;
    background-size: cover;
    background-image: url('/images/bmw-3.jpg');
    background-position: center;
}

.skytech-hero::before {
    content: "";
    position: absolute;
    inset: 0;
    z-index: -1;
    background: linear-gradient(
        90deg,
        rgba(5, 18, 32, 0.90),
        rgba(5, 18, 32, 0.50) 55%,
        rgba(5, 18, 32, 0.20)
    );
}

.skytech-hero-copy,
.skytech-hero-video {
    flex: 1;
    min-width: 0;
}

.skytech-hero-copy {
    color: #fff;
}

.skytech-brand {
    margin: 0 0 1rem;
    color: #fff;
    font-size: 1rem;
    font-weight: bold;
    letter-spacing: 0.2em;
}

.skytech-hero-copy h1 {
    margin: 0 0 1.5rem;
    color: #fff;
    font-size: clamp(2rem, 4.5vw, 4rem);
    line-height: 1.12;
}

.skytech-hero-copy p {
    color: #fff;
    font-size: 1.15rem;
    line-height: 1.6;
}

.skytech-hero-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 1rem;
    margin-top: 2rem;
}

.skytech-hero-actions a {
    display: inline-block;
    padding: 0.9rem 1.3rem;
    border: 2px solid #fff;
    border-radius: 6px;
    color: #fff;
    font-weight: bold;
    text-decoration: none;
}

.skytech-hero-actions a:first-child {
    background: #fff;
    color: #10283d;
}

.skytech-hero-actions a:hover {
    background: #dceeff;
    border-color: #dceeff;
    color: #10283d;
}

.skytech-hero-actions a:focus-visible {
    outline: 3px solid #7ed5ff;
    outline-offset: 4px;
}

.skytech-hero-video {
    overflow: hidden;
    aspect-ratio: 16 / 9;
    border: 5px solid #14283c;
    border-radius: 12px;
    background: #000;
    transform: rotate(-4deg);
    box-shadow:
        0 20px 50px rgba(0, 0, 0, 0.55),
        0 0 25px rgba(100, 190, 255, 0.25);
}

.skytech-hero-video iframe {
    display: block;
    width: 100%;
    height: 100%;
    border: 0;
}

@media (max-width: 800px) {
    .skytech-hero {
        flex-direction: column;
        gap: 2.5rem;
        min-height: auto;
        padding: 3rem 7%;
    }

    .skytech-hero-copy,
    .skytech-hero-video {
        flex: auto;
        width: 100%;
    }

    .skytech-hero-video {
        transform: rotate(-2deg);
    }
}
</style>

<section class="grid">
    <div class="col-12 bg bg-featured skytech-hero">
        <div class="skytech-hero-copy">
            <p class="skytech-brand">SKYTECH SPORT</p>

            <h1>Trainiere wie ein Profi.<br>Das ganze Jahr.</h1>

            <p>
                Erlebe Ski- und Snowboardtraining auf virtuellen
                Pisten – in unserem Studio in München oder mit
                deinem eigenen Simulator.
            </p>

            <div class="skytech-hero-actions">
                <a href="/unserstudio.html">Simulator entdecken</a>
                <a href="/kontaktformular.html">Kaufen oder Mieten</a>
            </div>
        </div>

        <div class="skytech-hero-video">
            <iframe
                src="https://www.youtube.com/embed/JSZYOQPFKfo"
                title="SkyTechSport Ski- und Snowboard-Simulator"
                loading="lazy"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                allowfullscreen>
            </iframe>
        </div>
    </div>
</section>
